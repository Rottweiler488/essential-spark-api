name: CD Hello app

on:
  workflow_run:
    workflows:
      - "CI Hello app"
    types:
      - completed

  workflow_dispatch:
    inputs:
      reason:
        description: "Name the reason"
        default: "Update"
        required: true
      version:
        description: "Version"
        required: true
        default: "latest"
      run_id:
        description: "CI workflow run Id"
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatсh' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application
          path: build/libs/
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.TOKEN_GITHUB }}

      - name: Copy JAR
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/opt/essential-spark"
          strip_components: 2

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv /opt/essential-spark/*.jar /opt/essential-spark/esapp.jar
            sudo systemctl restart essential-spark