name: CI Hello app

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
    paths:
      - 'ci-hello.yml'
      - 'src/main/java/com/rottweiler488/essentialspark/hello'
      - 'src/main/java/com/rottweiler488/essentialspark/EssentialSparkApplication.java'
      - 'src/main/resources/application.yml'
      - 'src/test/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'config/**'
  pull_request:
    branches:
      - main
      - feature/**
      - fix/**

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew test --build-cache --stacktrace --info

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew build -x check --build-cache

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: build/libs/*.jar
          retention-days: 2